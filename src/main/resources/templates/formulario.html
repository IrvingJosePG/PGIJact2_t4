<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuevo Cuestionario</title>
</head>
<body>
    <h2>Registrar Cuestionario</h2>
    <form th:action="@{/cuestionarios/guardar}" th:object="${cuestionario}" method="post">
        <label>Título: </label>
        <input type="text" th:field="*{titulo}" required /><br/><br/>
        
        <label>Materia: </label>
        <input type="text" th:field="*{materia}" required /><br/><br/>
        
        <label>Duración (minutos): </label>
        <input type="number" th:field="*{duracionMinutos}" required /><br/><br/>
        
        <button type="submit">Guardar</button>
    </form>
</body>
</html>
